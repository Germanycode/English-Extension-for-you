<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GermanyVocab</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      overflow: hidden;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: #12121f;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.4px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .tab-btn.active {
      color: #a5b4fc;
      border-bottom-color: #6366f1;
    }
    .tab-btn:hover:not(.active) {
      color: #94a3b8;
    }
    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }

    /* ── Sentence Translator ── */
    .translator-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .translator-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #64748b;
      font-weight: 600;
    }
    .lang-direction {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .lang-pill {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
    }
    .lang-pill.en {
      background: rgba(99,102,241,0.2);
      color: #a5b4fc;
    }
    .lang-pill.vi {
      background: rgba(251,146,60,0.2);
      color: #fdba74;
    }
    .arrow-icon { color: #475569; font-size: 14px; }
    .translator-input {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      background: #1a1a2e;
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 13px;
      font-family: inherit;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    .translator-input::placeholder { color: #475569; }
    .translator-input:focus { border-color: rgba(99,102,241,0.6); }
    .translator-result {
      background: #1a1a2e;
      border: 1px solid rgba(251,146,60,0.2);
      border-radius: 10px;
      padding: 12px;
      min-height: 70px;
      font-size: 13px;
      line-height: 1.6;
      color: #94a3b8;
      word-break: break-word;
      transition: border-color 0.2s;
    }
    .translator-result.has-result {
      color: #fdba74;
      border-color: rgba(251,146,60,0.4);
    }
    .translator-result.error-state {
      color: #f87171;
      border-color: rgba(248,113,113,0.3);
    }
    .char-counter {
      font-size: 10px;
      color: #475569;
      text-align: right;
      margin-top: -6px;
    }
    .char-counter.warn { color: #f59e0b; }
    .btn-translate {
      background: linear-gradient(135deg, #f97316, #fb923c);
      color: white;
      box-shadow: 0 4px 15px rgba(249,115,22,0.3);
    }
    .btn-translate:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(249,115,22,0.45);
    }
    .btn-translate:active { transform: translateY(0); }
    .btn-translate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .copy-row {
      display: flex;
      justify-content: flex-end;
    }
    .btn-copy {
      display: flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px;
      color: #64748b;
      font-size: 11px;
      font-family: inherit;
      padding: 5px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-copy:hover {
      background: rgba(255,255,255,0.05);
      color: #94a3b8;
    }
    .btn-copy.copied {
      color: #4ade80;
      border-color: rgba(74,222,128,0.3);
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      padding: 18px 20px 16px;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -30px; right: -20px;
      width: 100px; height: 100px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -20px; left: 20px;
      width: 60px; height: 60px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-level-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }
    .header-level-pill .level-badge {
      background: #f59e0b;
      color: #1a1a2e;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
    }
    .logo-img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .header-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      font-weight: 400;
    }

    /* ── Body padding ── */
    .body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Stats Row ── */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .stat-card {
      background: #1a1a2e;
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.2s;
    }
    .stat-card:hover {
      border-color: rgba(99,102,241,0.5);
    }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #64748b;
      font-weight: 600;
    }
    .stat-bottom {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-icon {
      font-size: 16px;
    }
    .stat-val {
      font-size: 22px;
      font-weight: 700;
      color: #a5b4fc;
      line-height: 1;
    }
    .stat-card.due .stat-val {
      color: #f472b6;
    }
    .stat-card.due {
      border-color: rgba(244,114,182,0.2);
    }
    .stat-card.due:hover {
      border-color: rgba(244,114,182,0.5);
    }

    /* ── Quick Translate Card ── */
    .quick-translate-card {
      background: #1a1a2e;
      border: 1px solid rgba(99,102,241,0.15);
      border-radius: 12px;
      padding: 14px;
    }
    .qt-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .qt-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .qt-input {
      flex: 1;
      padding: 9px 12px;
      background: #12121f;
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .qt-input::placeholder { color: #475569; }
    .qt-input:focus {
      border-color: rgba(99,102,241,0.6);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .qt-search-btn {
      padding: 9px 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .qt-search-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99,102,241,0.4);
    }
    .qt-search-btn:active { transform: translateY(0); }
    .qt-search-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Result area */
    .qt-result {
      display: none;
      flex-direction: column;
      gap: 8px;
      animation: qt-fade-in 0.25s ease;
    }
    .qt-result.visible { display: flex; }
    @keyframes qt-fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .qt-word-heading {
      font-size: 17px;
      font-weight: 700;
      color: #c7d2fe;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .qt-lemma-arrow {
      font-size: 12px;
      color: #475569;
    }
    .qt-pos-badge {
      font-size: 9px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(139,92,246,0.2);
      color: #c4b5fd;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Pronunciation */
    .qt-pronunciation-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }
    .qt-speak-btn {
      background: rgba(99,102,241,0.18);
      border: 1px solid rgba(99,102,241,0.3);
      color: #a5b4fc;
      font-size: 14px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      padding: 0;
      line-height: 1;
    }
    .qt-speak-btn:hover {
      background: rgba(99,102,241,0.35);
      transform: scale(1.1);
    }
    .qt-speak-btn:active { transform: scale(0.95); }
    .qt-speak-btn.playing {
      background: rgba(99,102,241,0.4);
      border-color: rgba(99,102,241,0.6);
      animation: qt-speak-pulse 0.8s ease-in-out infinite;
    }
    @keyframes qt-speak-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.3); }
      50% { box-shadow: 0 0 0 5px rgba(99,102,241,0); }
    }
    .qt-accent-toggle {
      background: transparent;
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #94a3b8;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .qt-accent-toggle:hover {
      background: rgba(148, 163, 184, 0.1);
      color: #e2e8f0;
    }
    .qt-phonetic {
      font-size: 12px;
      color: #64748b;
      font-style: italic;
      letter-spacing: 0.3px;
    }
    .lang-badge {
      font-size: 9px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .lang-badge.en {
      background: rgba(99,102,241,0.2);
      color: #a5b4fc;
    }
    .lang-badge.vi {
      background: rgba(251,146,60,0.2);
      color: #fdba74;
    }
    .qt-meaning-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      line-height: 1.5;
    }
    .qt-meaning-row .lang-badge {
      margin-top: 2px;
      flex-shrink: 0;
    }
    .qt-meaning-text {
      color: #94a3b8;
    }
    .qt-meaning-text.vi {
      color: #fdba74;
    }
    .qt-meaning-text.loading {
      color: #475569;
      font-style: italic;
    }
    .qt-meaning-text.error {
      color: #f87171;
    }

    /* Add to Vocab button */
    .qt-add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 14px;
      margin-top: 4px;
      background: rgba(74,222,128,0.12);
      border: 1px solid rgba(74,222,128,0.25);
      border-radius: 8px;
      color: #4ade80;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .qt-add-btn:hover {
      background: rgba(74,222,128,0.2);
      border-color: rgba(74,222,128,0.45);
    }
    .qt-add-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .qt-add-btn.success {
      background: rgba(74,222,128,0.25);
      color: #86efac;
      border-color: rgba(74,222,128,0.5);
    }
    .qt-add-btn.already {
      background: rgba(251,191,36,0.12);
      color: #fbbf24;
      border-color: rgba(251,191,36,0.3);
    }

    .qt-idle-hint {
      font-size: 12px;
      color: #475569;
      text-align: center;
      padding: 6px 0;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.05);
    }

    /* ── Buttons ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 4px 15px rgba(99,102,241,0.35);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99,102,241,0.5);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .btn-outline {
      background: transparent;
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.05);
      color: #e2e8f0;
      border-color: rgba(255,255,255,0.2);
    }
    .btn-icon {
      font-size: 16px;
    }

    /* ── Footer ── */
    .footer {
      padding: 0 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── PDF Button ── */
    .btn-pdf {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: white;
      box-shadow: 0 4px 14px rgba(14,165,233,0.3);
    }
    .btn-pdf:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(14,165,233,0.45);
    }
    .btn-pdf:active { transform: translateY(0); }

    /* ── PDF URL input row ── */
    .pdf-url-input {
      width: 100%;
      padding: 9px 12px;
      background: #1a1a2e;
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 11px;
      font-family: 'Fira Code', 'Courier New', monospace;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 4px;
    }
    .pdf-url-input:focus {
      border-color: rgba(99,102,241,0.7);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .pdf-url-input::placeholder { color: #475569; }
    .btn-pdf-go {
      width: 100%;
      padding: 8px;
      background: rgba(99,102,241,0.18);
      border: 1px solid rgba(99,102,241,0.35);
      border-radius: 8px;
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.18s;
    }
    .btn-pdf-go:hover {
      background: rgba(99,102,241,0.3);
      color: #c7d2fe;
    }
    .pdf-url-error {
      font-size: 11px;
      color: #f87171;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="header-left">
        <img class="logo-img" src="../assets/icons/icon48.png" alt="GermanyVocab logo">
        <span class="logo-text">GermanyVocab</span>
      </div>
      <div class="header-level-pill" id="header-level-pill" title="Your learning level & XP">
        <span class="level-badge" id="popup-level-badge">Lv. 1</span>
        <span class="xp-text" id="popup-xp-text">0 XP</span>
      </div>
    </div>
    <div class="header-sub">Your German &amp; English vocab trainer</div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-home" data-tab="panel-home">
      <span>🏠</span> Home
    </button>
    <button class="tab-btn" id="tab-translate" data-tab="panel-translate">
      <span>🌐</span> Translate
    </button>
  </div>

  <!-- ══ HOME PANEL ══ -->
  <div class="tab-panel active" id="panel-home">
    <div class="body">
      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Words</div>
          <div class="stat-bottom">
            <span class="stat-icon">📚</span>
            <span id="total-words" class="stat-val">0</span>
          </div>
        </div>
        <div class="stat-card due">
          <div class="stat-label">Due</div>
          <div class="stat-bottom">
            <span class="stat-icon">⚡</span>
            <span id="due-words" class="stat-val">0</span>
          </div>
        </div>
        <div class="stat-card streak">
          <div class="stat-label">Streak</div>
          <div class="stat-bottom">
            <span class="stat-icon">🔥</span>
            <span id="streak-days" class="stat-val">0</span>
          </div>
        </div>
      </div>

      <!-- Quick Translate -->
      <div class="quick-translate-card">
        <div class="qt-label">🔍 Quick Translate</div>
        <div class="qt-input-row">
          <input type="text" id="qt-word-input" class="qt-input" placeholder="Type a word to translate…" spellcheck="false" autocomplete="off" />
          <button id="qt-search-btn" class="qt-search-btn" title="Translate">🔎</button>
        </div>
        <div id="qt-result" class="qt-result">
          <div id="qt-word-heading" class="qt-word-heading"></div>
          <div id="qt-pronunciation-row" class="qt-pronunciation-row" style="display:none">
            <button id="qt-speak-btn" class="qt-speak-btn" title="Listen to pronunciation">🔊</button>
            <button id="qt-accent-toggle" class="qt-accent-toggle" title="Switch Accent">US</button>
            <span id="qt-phonetic" class="qt-phonetic"></span>
          </div>
          <div class="qt-meaning-row">
            <span class="lang-badge en">EN</span>
            <span id="qt-en-meaning" class="qt-meaning-text loading">Looking up…</span>
          </div>
          <div class="qt-meaning-row">
            <span class="lang-badge vi">VI</span>
            <span id="qt-vi-meaning" class="qt-meaning-text loading">Translating…</span>
          </div>
          <button id="qt-add-btn" class="qt-add-btn" style="display:none">
            <span>+</span> Add to Vocab
          </button>
        </div>
        <div id="qt-idle-hint" class="qt-idle-hint">Type any English word and press Enter</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="footer">
      <button id="open-review" class="btn btn-primary">
        <span class="btn-icon">🎯</span>
        Open Vocab &amp; Review
      </button>

      <!-- PDF Viewer button -->
      <button id="open-pdf-btn" class="btn btn-pdf">
        <span class="btn-icon">📄</span>
        Open PDF in Viewer
      </button>

      <button id="open-options" class="btn btn-outline">
        <span class="btn-icon">⚙️</span>
        Settings
      </button>
    </div>
  </div>

  <!-- ══ TRANSLATE PANEL ══ -->
  <div class="tab-panel" id="panel-translate">
    <div class="translator-body">
      <div class="lang-direction">
        <span class="lang-pill en">🇬🇧 English</span>
        <span class="arrow-icon">→</span>
        <span class="lang-pill vi">🇻🇳 Vietnamese</span>
      </div>

      <div>
        <div class="translator-label">Enter sentence</div>
        <textarea
          id="sentence-input"
          class="translator-input"
          placeholder="Type or paste an English sentence here…"
          maxlength="500"
          spellcheck="false"
        ></textarea>
        <div class="char-counter"><span id="char-count">0</span> / 500</div>
      </div>

      <button id="translate-btn" class="btn btn-translate">
        <span>🌐</span> Translate Sentence
      </button>

      <div>
        <div class="translator-label">Vietnamese translation</div>
        <div id="translation-result" class="translator-result">
          Translation will appear here…
        </div>
      </div>

      <div class="copy-row">
        <button id="copy-btn" class="btn-copy" style="display:none">
          <span>📋</span> Copy
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
